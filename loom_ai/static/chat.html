<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Loom Chat</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --text: #e8e8e8;
    --muted: #9a9a9a;
    --accent: #d97757;
    --accent-dim: #b45c3f;
    --danger: #e85d5d;
    --radius: 16px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  header .logo {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #7c5cff);
  }
  header h1 { font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; }
  header .status {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #666;
  }
  header .dot.ok { background: #3ecf8e; }
  header .dot.err { background: var(--danger); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    display: flex;
    gap: 12px;
    line-height: 1.55;
    font-size: 0.95rem;
  }
  .msg .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 0.7rem; font-weight: 700;
  }
  .msg.user .avatar { background: var(--surface2); color: var(--text); }
  .msg.assistant .avatar {
    background: linear-gradient(135deg, #a24830, #5a3dbf);
    color: #fff;
  }
  .msg .body {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .msg .body pre {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 0.85rem;
    margin: 8px 0;
  }
  .msg .body code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .msg .body pre code { background: none; padding: 0; }
  .typing {
    display: inline-flex; gap: 4px; padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }
  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 16px 16px;
  }
  .composer-wrap { max-width: 800px; margin: 0 auto; }
  .composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .composer:focus-within { border-color: var(--accent-dim); }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 0.95rem;
    resize: none;
    max-height: 160px;
    line-height: 1.45;
    min-height: 24px;
  }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    width: 36px; height: 36px;
    cursor: pointer;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  #send:hover { background: var(--accent-dim); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar select, .toolbar input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.8rem;
  }
  .toolbar label { font-size: 0.75rem; color: var(--muted); }
  .hint {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
  }
  .empty h2 {
    color: var(--text);
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 1.25rem;
  }
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 20px;
  }
  .suggestions button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .suggestions button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Loom</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
</header>
<main id="messages">
  <div class="empty" id="empty">
    <h2>How can I help you today?</h2>
    <p>Chat with your configured LLM via loom-ai.</p>
    <div class="suggestions">
      <button type="button" data-q="Explain this codebase architecture in plain language">Explain architecture</button>
      <button type="button" data-q="Write a Python function to debounce an async coroutine">Write code</button>
      <button type="button" data-q="What are the trade-offs of multi-model consensus?">Consensus trade-offs</button>
    </div>
  </div>
</main>
<footer>
  <div class="composer-wrap">
    <div class="toolbar">
      <label>Model <select id="model"><option value="">default</option></select></label>
      <label>System <input type="text" id="system" placeholder="optional system prompt" style="width:220px"/></label>
      <label><input type="checkbox" id="stream" checked/> stream</label>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message Loom…" aria-label="Chat message" autofocus></textarea>
      <button id="send" title="Send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <p class="hint">Enter to send · Shift+Enter for newline · Auth via LOOM_API_KEY if set</p>
  </div>
</footer>
<script type="module">
const API_KEY = new URLSearchParams(location.search).get("key") || localStorage.getItem("loom_api_key") || "";
const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const modelSel = document.getElementById("model");
const systemInp = document.getElementById("system");
const streamChk = document.getElementById("stream");
const empty = document.getElementById("empty");
const history = [];

function headers() {
  const h = { "Content-Type": "application/json" };
  if (API_KEY) h["Authorization"] = "Bearer " + API_KEY;
  return h;
}

function setStatus(ok, text) {
  let cls = "";
  if (ok === true) cls = "ok";
  else if (ok === false) cls = "err";
  document.getElementById("dot").className = "dot " + cls;
  document.getElementById("statusText").textContent = text;
}

async function boot() {
  try {
    const r = await fetch("/health", { headers: headers() });
    const j = await r.json();
    setStatus(true, (j.backends && j.backends.llm) || "healthy");
    if (j.backends && j.backends.llm && j.backends.llm !== "None") {
      try {
        const m = await fetch("/llm/models", { headers: headers() });
        if (m.ok) {
          const mj = await m.json();
          (mj.models || []).forEach(name => {
            const o = document.createElement("option");
            o.value = name; o.textContent = name;
            modelSel.appendChild(o);
          });
        }
      } catch (error_) {
        console.error("Failed to load models:", error_);
      }
    }
  } catch (error_) {
    console.error("Health check failed:", error_);
    setStatus(false, "offline");
  }
}

function escapeHtml(s) {
  return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function renderMarkdownLite(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code class="lang-${lang}">${code}</code></pre>`);
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  return html;
}

function addMsg(role, content, {streaming} = {}) {
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = role === "user" ? "You" : "L";
  const body = document.createElement("div");
  body.className = "body";
  if (streaming) {
    body.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  } else {
    body.innerHTML = role === "assistant" ? renderMarkdownLite(content) : escapeHtml(content);
  }
  div.appendChild(av);
  div.appendChild(body);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return body;
}

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}
input.addEventListener("input", autosize);

function buildPayload() {
  const msgs = [];
  const sys = systemInp.value.trim();
  if (sys) msgs.push({ role: "system", content: sys });
  history.forEach(m => msgs.push(m));
  const payload = { messages: msgs, temperature: 0.7 };
  if (modelSel.value) payload.model = modelSel.value;
  return payload;
}

function showError(bodyEl, error_) {
  bodyEl.innerHTML = `<span style="color:var(--danger)">Error: ${escapeHtml(String(error_.message || error_))}</span>`;
}

async function sendNonStreaming(payload, bodyEl) {
  const r = await fetch("/llm/chat", {
    method: "POST",
    headers: headers(),
    body: JSON.stringify(payload),
  });
  if (!r.ok) throw new Error(await r.text() || r.statusText);
  const j = await r.json();
  const content = j.content || j.response || JSON.stringify(j);
  bodyEl.innerHTML = renderMarkdownLite(content);
  history.push({ role: "assistant", content });
}

async function sendStreaming(payload, bodyEl) {
  const r = await fetch("/llm/chat/stream", {
    method: "POST",
    headers: headers(),
    body: JSON.stringify(payload),
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error(err || r.statusText);
  }
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let acc = "";
  bodyEl.textContent = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    acc = processStreamChunk(dec.decode(value, { stream: true }), acc, bodyEl);
  }
  if (!acc) throw new Error("empty stream");
  history.push({ role: "assistant", content: acc });
}

function processStreamChunk(chunk, acc, bodyEl) {
  for (const line of chunk.split("\n")) {
    if (!line.startsWith("data: ")) continue;
    const data = line.slice(6);
    if (data === "[DONE]") continue;
    try {
      const j = JSON.parse(data);
      acc += j.delta || j.content || "";
    } catch {
      acc += data;
    }
    bodyEl.innerHTML = renderMarkdownLite(acc);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  return acc;
}

function isRetryableError(e) {
  return String(e.message).includes("404") || String(e).includes("empty stream");
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  autosize();
  sendBtn.disabled = true;
  addMsg("user", text);
  history.push({ role: "user", content: text });

  const bodyEl = addMsg("assistant", "", { streaming: true });
  const payload = buildPayload();

  try {
    if (streamChk.checked) {
      await sendStreaming(payload, bodyEl);
    } else {
      await sendNonStreaming(payload, bodyEl);
    }
  } catch (e) {
    if (!isRetryableError(e)) { showError(bodyEl, e); return; }
    try {
      await sendNonStreaming(payload, bodyEl);
    } catch (error_) {
      showError(bodyEl, error_);
    }
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
document.querySelectorAll(".suggestions button").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.dataset.q;
    autosize();
    send();
  });
});

await boot();
</script>
</body>
</html>
