[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flossware-loom-ai"
version = "0.1"
description = "AI-first execution substrate built around Intent, Worker, and Arbiter"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "FlossWare" }]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["loom_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
extend-ignore = ["E501"]
