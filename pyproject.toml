[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flossware-loom-ai"
version = "0.3"
description = "Pluggable AI orchestration framework with backend-agnostic protocols"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "FlossWare" }]
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Typing :: Typed"]

[project.optional-dependencies]
postgresql = ["asyncpg>=0.29", "pgvector>=0.2", "cryptography>=42.0"]
redis = ["redis[hiredis]>=5.0"]
orientdb = ["pyorient>=1.5"]
openai = ["openai>=1.0"]
litellm = ["litellm>=1.0"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
observability = ["structlog>=24.0"]
cli = []
tui = ["curses-themes @ git+https://github.com/FlossWare/curses-themes.git"]
all = ["flossware-loom-ai[postgresql,redis,orientdb,openai,litellm,server,observability,cli,tui]"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-benchmark>=4.0", "ruff>=0.4", "httpx>=0.24", "httpx2>=0.1", "pip-audit>=2.7", "pre-commit>=3.7", "hypothesis>=6.0"]
loadtest = ["locust>=2.20"]

[project.scripts]
loom = "loom_ai.clients.cli.app:main"
loom-tui = "loom_ai.clients.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["loom_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgresql: tests requiring the postgresql optional dependency group", "redis: tests requiring the redis optional dependency group", "orientdb: tests requiring the orientdb optional dependency group", "openai: tests requiring the openai optional dependency group", "litellm: tests requiring the litellm optional dependency group", "server: tests requiring the server optional dependency group"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
extend-ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"loom_ai/backends/free_model_router.py" = ["F401"]
"loom_ai/demo_agent.py" = ["F401"]
"loom_ai/routers/storage.py" = ["I001"]
"tests/test_mcp_server.py" = ["F401"]

[tool.coverage.run]
source = ["loom_ai"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__"]
