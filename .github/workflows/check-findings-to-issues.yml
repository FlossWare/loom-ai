name: Create issues from check findings

on:
  check_run:
    types: [completed]

permissions:
  issues: write
  checks: read

jobs:
  create-issues:
    if: >-
      contains(fromJSON('["SonarCloud Code Analysis", "GitGuardian Security Checks"]'), github.event.check_run.name)
      && (
        github.event.check_run.conclusion != 'success'
        || github.event.check_run.output.annotations_count > 0
      )
    runs-on: ubuntu-latest
    steps:
      - name: Fetch annotations and create issues
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const checkRun = context.payload.check_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkName = checkRun.name;
            const conclusion = checkRun.conclusion;

            const findings = [];

            if (conclusion === 'failure' || conclusion === 'action_required') {
              findings.push({
                title: `${checkName}: check ${conclusion}`,
                body: [
                  `## ${checkName} — ${conclusion}`,
                  '',
                  `**Check run:** ${checkRun.html_url}`,
                  `**Commit:** \`${checkRun.head_sha.slice(0, 7)}\``,
                  `**Branch:** ${checkRun.check_suite?.head_branch || 'unknown'}`,
                  '',
                  `### Output`,
                  checkRun.output?.title || 'No title',
                  '',
                  checkRun.output?.summary || 'No summary available.',
                  '',
                  `---`,
                  `*Auto-created by check-findings-to-issues workflow*`,
                ].join('\n'),
                labels: checkName.includes('SonarCloud')
                  ? ['bug', 'sonarcloud']
                  : ['bug', 'security'],
              });
            }

            const annotations = await github.paginate(
              github.rest.checks.listAnnotations,
              { owner, repo, check_run_id: checkRun.id, per_page: 100 }
            );

            for (const ann of annotations) {
              if (ann.annotation_level === 'notice') continue;

              const level = ann.annotation_level.toUpperCase();
              const location = ann.path
                ? `${ann.path}:${ann.start_line}`
                : 'N/A';

              findings.push({
                title: `${checkName}: ${ann.title || ann.message.slice(0, 80)}`,
                body: [
                  `## ${checkName} Finding`,
                  '',
                  `**Level:** ${level}`,
                  `**File:** \`${location}\``,
                  `**Commit:** \`${checkRun.head_sha.slice(0, 7)}\``,
                  `**Check run:** ${checkRun.html_url}`,
                  '',
                  `### Message`,
                  ann.message,
                  '',
                  ann.raw_details ? `### Details\n${ann.raw_details}\n` : '',
                  `<!-- fingerprint: ${checkName}|${ann.path}|${ann.start_line}|${(ann.title || ann.message).slice(0, 120)} -->`,
                  `---`,
                  `*Auto-created by check-findings-to-issues workflow*`,
                ].join('\n'),
                labels: checkName.includes('SonarCloud')
                  ? ['bug', 'sonarcloud']
                  : ['bug', 'security'],
              });
            }

            if (findings.length === 0) {
              core.info('No actionable findings — nothing to do.');
              return;
            }

            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );
            const existingTitles = new Set(existingIssues.map(i => i.title));

            let created = 0;
            for (const finding of findings) {
              if (existingTitles.has(finding.title)) {
                core.info(`Skipping duplicate: ${finding.title}`);
                continue;
              }

              for (const label of finding.labels) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: label });
                } catch {
                  try {
                    await github.rest.issues.createLabel({
                      owner, repo,
                      name: label,
                      color: label === 'security' ? 'e11d48'
                           : label === 'sonarcloud' ? '4c9bd6'
                           : 'd73a4a',
                    });
                  } catch (e) {
                    core.warning(`Could not create label "${label}": ${e.message}`);
                  }
                }
              }

              try {
                const issue = await github.rest.issues.create({
                  owner, repo,
                  title: finding.title,
                  body: finding.body,
                  labels: finding.labels,
                });
                core.info(`Created issue #${issue.data.number}: ${finding.title}`);
                created++;
              } catch (e) {
                core.error(`Failed to create issue "${finding.title}": ${e.message}`);
              }
            }

            core.info(`Done. Created ${created} issue(s), skipped ${findings.length - created} duplicate(s).`);
