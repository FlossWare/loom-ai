name: Test Matrix

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: pip install -e ".[dev]"

      - name: Run core tests
        run: >-
          python -m pytest tests/ -x -q
          --ignore=tests/test_postgresql.py
          --ignore=tests/test_redis_queue.py
          --ignore=tests/test_server_auth.py
          --ignore=tests/test_server_port.py
          --ignore=tests/test_server_responses.py
          --ignore=tests/test_server_secrets.py
          --ignore=tests/test_server_validation.py
          --ignore=tests/test_queue_validation.py

  postgresql:
    name: PostgreSQL tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,postgresql]"

      - name: Run postgresql tests
        run: python -m pytest tests/ -x -q -m postgresql

  redis:
