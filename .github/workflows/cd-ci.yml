name: CD-CI

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event.pusher.email != 'version-bump@flossware.org'
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install hatchling==1.32.0 build==1.5.0 twine==7.0.0 --only-binary :all:

      - name: Install dev dependencies and run tests
        run: |
          pip install --only-binary :all: -r requirements-ci.txt
          pip install --no-deps -e .
          python -m pytest tests/ -v --tb=short

      - name: Lint check
        run: ruff check loom_ai/

      - name: Setup .gitconfig for version bumps
        uses: oleksiyrudenko/gha-git-credentials@8bb1fe6d543b2233ef1856cd3b0181f5abbd4d6a # v2.1.2
        with:
          global: true
          name: 'Version Bump'
          email: 'version-bump@flossware.org'
          actor: 'VersionBump'
          token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Bump minor version
        run: |
          chmod +x scripts/bump-version.sh
          scripts/bump-version.sh minor

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Commit version bump and tag
        run: |
          VERSION=$(python -c "import loom_ai; print(loom_ai.__version__)")
          git add pyproject.toml loom_ai/__init__.py loom_ai/server.py
          git commit -m "Bump version to ${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin main --tags
