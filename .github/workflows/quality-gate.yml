name: Python Quality Gate

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    - cron: '15 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,server]"

      - name: Lint with ruff
        id: ruff
        continue-on-error: true
        run: |
          ruff check loom_ai/ tests/ 2>&1 | tee ruff-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          ERRORS=$(grep -c "^loom_ai\|^tests" ruff-output.txt || echo "0")
          echo "error_count=$ERRORS" >> $GITHUB_OUTPUT

      - name: Format check with ruff
        id: format
        continue-on-error: true
        run: |
          ruff format --check loom_ai/ tests/ 2>&1 | tee format-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Verify imports
        id: imports
        run: |
          python -c "
          from loom_ai import LoomConfig, Document, Chunk, ChatMessage
          from loom_ai.protocols import StorageBackend, QueueBackend, LLMBackend
          from loom_ai.backends.memory import MemoryStorageBackend, MemoryQueueBackend
          from loom_ai.backends.env_secrets import EnvSecretsBackend
          from loom_ai.backends.http_llm import HttpLLMBackend
          cfg = LoomConfig.from_env()
          assert isinstance(cfg.storage, StorageBackend)
          assert isinstance(cfg.queue, QueueBackend)
          print('All imports and protocol checks passed')
          "

      - name: Verify version format (X.Y)
        run: |
          VERSION=$(python -c "import loom_ai; print(loom_ai.__version__)")
          if ! echo "$VERSION" | grep -qP '^\d+\.\d+$'; then
            echo "Error: Version '$VERSION' is not in X.Y format"
            exit 1
          fi
          echo "Version: $VERSION (X.Y format OK)"

      - name: Comment on PR with quality metrics
        if: github.event_name == 'pull_request' && always() && matrix.python-version == '3.12'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ruffErrors = '${{ steps.ruff.outputs.error_count }}' || '0';
            const ruffOk = '${{ steps.ruff.outputs.exit_code }}' === '0';
            const formatOk = '${{ steps.format.outputs.exit_code }}' === '0';
            const testsOk = '${{ steps.tests.outputs.exit_code }}' === '0';

            const comment = `## Quality Gate Report

            | Check | Status |
            |-------|--------|
            | **Ruff lint** | ${ruffOk ? '✅' : '❌'} ${ruffErrors} issues |
            | **Ruff format** | ${formatOk ? '✅' : '❌'} |
            | **Tests** | ${testsOk ? '✅' : '❌'} |
            | **Imports** | ✅ |
            | **Version (X.Y)** | ✅ |

            ${ruffOk && formatOk && testsOk ? '✅ **All quality gates passed!**' : '⚠️ **Quality gates failed!** Fix issues before merging.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if quality gates not met
        if: |
          steps.ruff.outputs.exit_code != '0' ||
          steps.format.outputs.exit_code != '0' ||
          steps.tests.outputs.exit_code != '0'
        run: |
          echo "Quality gates failed!"
          if [ "${{ steps.ruff.outputs.exit_code }}" != "0" ]; then
            echo "  - ruff check failed"
          fi
          if [ "${{ steps.format.outputs.exit_code }}" != "0" ]; then
            echo "  - ruff format --check failed"
          fi
          if [ "${{ steps.tests.outputs.exit_code }}" != "0" ]; then
            echo "  - pytest failed"
          fi
          exit 1
